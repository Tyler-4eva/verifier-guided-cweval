name: CWEval CWE-20 Sandbox Evaluation

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. CHECK OUT THIS RESEARCH REPOSITORY
      # ------------------------------------------------------------
      - name: Checkout research repository
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # 2. CLONE THE EXACT CWEVAL VERSION USED IN COLAB
      # ------------------------------------------------------------
      - name: Clone exact CWEval revision
        shell: bash
        run: |
          set -euo pipefail

          echo "Cloning CWEval..."

          git clone \
            https://github.com/Co1lin/CWEval.git \
            "$RUNNER_TEMP/CWEval"

          cd "$RUNNER_TEMP/CWEval"

          git checkout \
            e9a2a124c8c53679b6d8d27adfd2f6c40e7576d7

          echo ""
          echo "CWEval commit:"
          git rev-parse HEAD

      # ------------------------------------------------------------
      # 3. VERIFY OUR GENERATED CWE-20 SAMPLE EXISTS
      # ------------------------------------------------------------
      - name: Verify CWE-20 evaluation input
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository evaluation files:"
          find evals/cwe20 -type f -print

          RAW_FILE="evals/cwe20/generated_0/core/py/cwe_020_0_raw.py"

          if [ ! -f "$RAW_FILE" ]; then
            echo "ERROR: Required generated sample not found:"
            echo "$RAW_FILE"
            exit 1
          fi

          echo ""
          echo "✓ CWE-20 generated sample found."

      # ------------------------------------------------------------
      # 4. PULL CWEVAL'S OFFICIAL DOCKER IMAGE
      # ------------------------------------------------------------
      - name: Pull official CWEval Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "Pulling co1lin/cweval..."

          docker pull co1lin/cweval

          echo ""
          echo "Docker image ID:"

          docker image inspect \
            co1lin/cweval \
            --format '{{.Id}}'

          docker image inspect \
            co1lin/cweval \
            > docker_image_inspect.json

      # ------------------------------------------------------------
      # 5. CHECK THE CWEVAL CONTAINER ENVIRONMENT
      # ------------------------------------------------------------
      - name: Verify Python inside CWEval container
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            co1lin/cweval \
            zsh -lc '
              set -e

              echo "Shell:"
              echo "$SHELL"

              echo ""
              echo "PATH:"
              echo "$PATH"

              echo ""
              echo "Python location:"
              which python

              echo ""
              echo "Python version:"
              python --version

              echo ""
              echo "✓ CWEval container Python is available."
            '

      # ------------------------------------------------------------
      # 6. RUN THE ACTUAL CWEVAL EVALUATION
      # ------------------------------------------------------------
      - name: Run CWEval sandbox evaluation
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting sandboxed CWEval evaluation..."

          docker run --rm \
            -v "$RUNNER_TEMP/CWEval:/home/ubuntu/CWEval" \
            -v "$GITHUB_WORKSPACE/evals/cwe20:/eval" \
            -w /home/ubuntu/CWEval \
            co1lin/cweval \
            zsh -lc '
              set -e

              export PYTHONPATH=/home/ubuntu/CWEval

              echo ""
              echo "Python:"
              python --version

              echo ""
              echo "Evaluation directory:"
              find /eval -maxdepth 5 -type f -print

              echo ""
              echo "Running CWEval pipeline..."

              python cweval/evaluate.py pipeline \
                --eval_path /eval \
                --num_proc 1 \
                --docker False

              echo ""
              echo "✓ CWEval pipeline completed."
            '

      # ------------------------------------------------------------
      # 7. DISPLAY THE RESULT FILES IN THE GITHUB LOG
      # ------------------------------------------------------------
      - name: Display CWEval results
        if: always()
        shell: bash
        run: |
          echo "======================================================"
          echo "Generated evaluation files"
          echo "======================================================"

          find evals/cwe20 -maxdepth 8 -type f -print || true

          echo ""
          echo "======================================================"
          echo "res_all.json"
          echo "======================================================"

          if [ -f evals/cwe20/res_all.json ]; then
            cat evals/cwe20/res_all.json
          else
            echo "res_all.json not found."
          fi

          echo ""
          echo "======================================================"
          echo "generated_0/res.json"
          echo "======================================================"

          if [ -f evals/cwe20/generated_0/res.json ]; then
            cat evals/cwe20/generated_0/res.json
          else
            echo "generated_0/res.json not found."
          fi

      # ------------------------------------------------------------
      # 8. SAVE ALL EVALUATION OUTPUTS AS A DOWNLOADABLE ARTIFACT
      # ------------------------------------------------------------
      - name: Upload CWEval evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cwe20-evaluation-results
          path: |
            evals/cwe20/
            docker_image_inspect.json
          if-no-files-found: warn
