name: CWEval CWE-20 Sandbox Evaluation

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECK OUT RESEARCH REPOSITORY
      # ============================================================
      - name: Checkout research repository
        uses: actions/checkout@v6

      # ============================================================
      # 2. CLONE EXACT CWEVAL VERSION
      # ============================================================
      - name: Clone exact CWEval revision
        shell: bash
        run: |
          set -euo pipefail

          echo "Cloning CWEval..."

          git clone \
            https://github.com/Co1lin/CWEval.git \
            "$RUNNER_TEMP/CWEval"

          cd "$RUNNER_TEMP/CWEval"

          git checkout \
            e9a2a124c8c53679b6d8d27adfd2f6c40e7576d7

          echo ""
          echo "CWEval commit:"
          git rev-parse HEAD

      # ============================================================
      # 3. VERIFY ORIGINAL AI-GENERATED SAMPLE
      # ============================================================
      - name: Verify CWE-20 input
        shell: bash
        run: |
          set -euo pipefail

          RAW_FILE="evals/cwe20/generated_0/core/py/cwe_020_0_raw.py"

          echo "Research input files:"
          find evals/cwe20 -type f -print

          if [ ! -f "$RAW_FILE" ]; then
            echo ""
            echo "ERROR: Missing generated sample:"
            echo "$RAW_FILE"
            exit 1
          fi

          echo ""
          echo "✓ Original CWE-20 sample exists."

      # ============================================================
      # 4. CREATE A WRITABLE TEMPORARY EVALUATION DIRECTORY
      # ============================================================
      - name: Prepare writable evaluation workspace
        shell: bash
        run: |
          set -euo pipefail

          EVAL_WORK="$RUNNER_TEMP/cwe20_eval"

          echo "Creating writable evaluation directory:"
          echo "$EVAL_WORK"

          rm -rf "$EVAL_WORK"
          mkdir -p "$EVAL_WORK"

          # Copy the ORIGINAL generated sample.
          cp -a \
            "$GITHUB_WORKSPACE/evals/cwe20/." \
            "$EVAL_WORK/"

          # The CWEval container user must be able to create
          # _task.py, res.json, logs, etc.
          chmod -R a+rwX "$EVAL_WORK"

          echo ""
          echo "Temporary evaluation contents:"
          find "$EVAL_WORK" -type f -print

          echo ""
          echo "Permissions:"
          ls -ld "$EVAL_WORK"
          ls -ld "$EVAL_WORK/generated_0"
          ls -ld "$EVAL_WORK/generated_0/core/py"

      # ============================================================
      # 5. PULL OFFICIAL CWEVAL IMAGE
      # ============================================================
      - name: Pull official CWEval Docker image
        shell: bash
        run: |
          set -euo pipefail

          docker pull co1lin/cweval

          echo ""
          echo "Docker image ID:"

          docker image inspect \
            co1lin/cweval \
            --format '{{.Id}}'

          docker image inspect \
            co1lin/cweval \
            > docker_image_inspect.json

      # ============================================================
      # 6. VERIFY CWEVAL PYTHON ENVIRONMENT
      # ============================================================
      - name: Verify CWEval Python environment
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            co1lin/cweval \
            zsh -lc '
              set -e

              export CWEVAL_ENV=/home/ubuntu/miniforge3/envs/cweval
              export PATH="$CWEVAL_ENV/bin:$PATH"

              echo "========================================"
              echo "CWEval environment"
              echo "========================================"

              echo ""
              echo "Python:"
              command -v python
              python --version

              echo ""
              echo "Pytest:"
              command -v pytest
              pytest --version

              echo ""
              echo "✓ CWEval Python environment available."
            '

      # ============================================================
      # 7. RUN CWEVAL IN WRITABLE SANDBOX
      # ============================================================
      - name: Run CWEval sandbox evaluation
        shell: bash
        run: |
          set -euo pipefail

          EVAL_WORK="$RUNNER_TEMP/cwe20_eval"

          echo "Starting sandboxed CWEval evaluation..."

          docker run --rm \
            -v "$RUNNER_TEMP/CWEval:/home/ubuntu/CWEval" \
            -v "$EVAL_WORK:/eval" \
            -w /home/ubuntu/CWEval \
            co1lin/cweval \
            zsh -lc '
              set -e

              export CWEVAL_ENV=/home/ubuntu/miniforge3/envs/cweval
              export PATH="$CWEVAL_ENV/bin:$PATH"
              export PYTHONPATH=/home/ubuntu/CWEval

              echo ""
              echo "========================================"
              echo "Execution environment"
              echo "========================================"

              echo ""
              echo "Python:"
              command -v python
              python --version

              echo ""
              echo "Evaluation directory permissions:"
              ls -ld /eval
              ls -ld /eval/generated_0
              ls -ld /eval/generated_0/core/py

              echo ""
              echo "Evaluation input:"
              find /eval -maxdepth 8 -type f -print

              echo ""
              echo "Write test:"
              touch /eval/cweval_write_test.tmp
              ls -l /eval/cweval_write_test.tmp
              rm /eval/cweval_write_test.tmp

              echo ""
              echo "✓ Evaluation directory is writable."

              echo ""
              echo "========================================"
              echo "Starting CWEval pipeline"
              echo "========================================"

              python cweval/evaluate.py pipeline \
                --eval_path /eval \
                --num_proc 1 \
                --docker False

              echo ""
              echo "✓ CWEval evaluation completed."
            '

      # ============================================================
      # 8. COPY GENERATED RESULTS BACK INTO GITHUB WORKSPACE
      # ============================================================
      - name: Copy evaluation results back
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          EVAL_WORK="$RUNNER_TEMP/cwe20_eval"

          echo "Making evaluation results readable..."

          sudo chmod -R a+rwX "$EVAL_WORK" || true

          echo ""
          echo "Files produced by CWEval:"
          find "$EVAL_WORK" -maxdepth 10 -type f -print || true

          echo ""
          echo "Copying results back to repository workspace..."

          mkdir -p "$GITHUB_WORKSPACE/evals/cwe20"

          cp -a \
            "$EVAL_WORK/." \
            "$GITHUB_WORKSPACE/evals/cwe20/"

          echo ""
          echo "✓ Results copied back."

      # ============================================================
      # 9. DISPLAY CWEVAL RESULTS
      # ============================================================
      - name: Display CWEval results
        if: always()
        shell: bash
        run: |
          echo "======================================================"
          echo "Generated evaluation files"
          echo "======================================================"

          find evals/cwe20 -maxdepth 10 -type f -print || true

          echo ""
          echo "======================================================"
          echo "res_all.json"
          echo "======================================================"

          if [ -f evals/cwe20/res_all.json ]; then
            cat evals/cwe20/res_all.json
          else
            echo "res_all.json not found."
          fi

          echo ""
          echo "======================================================"
          echo "generated_0/res.json"
          echo "======================================================"

          if [ -f evals/cwe20/generated_0/res.json ]; then
            cat evals/cwe20/generated_0/res.json
          else
            echo "generated_0/res.json not found."
          fi

      # ============================================================
      # 10. SAVE RESULTS AS DOWNLOADABLE GITHUB ARTIFACT
      # ============================================================
      - name: Upload CWEval evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cwe20-evaluation-results
          path: |
            evals/cwe20/
            docker_image_inspect.json
          if-no-files-found: warn
