name: CWEval CWE-20 Sandbox Evaluation

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECK OUT OUR RESEARCH REPOSITORY
      # ============================================================
      - name: Checkout research repository
        uses: actions/checkout@v6


      # ============================================================
      # 2. CLONE THE EXACT CWEVAL REVISION USED IN COLAB
      # ============================================================
      - name: Clone exact CWEval revision
        shell: bash
        run: |
          set -euo pipefail

          echo "Cloning CWEval..."

          git clone \
            https://github.com/Co1lin/CWEval.git \
            "$RUNNER_TEMP/CWEval"

          cd "$RUNNER_TEMP/CWEval"

          git checkout \
            e9a2a124c8c53679b6d8d27adfd2f6c40e7576d7

          echo ""
          echo "Exact CWEval revision:"
          git rev-parse HEAD


      # ============================================================
      # 3. VERIFY THE ORIGINAL AI-GENERATED SAMPLE EXISTS
      # ============================================================
      - name: Verify CWE-20 input
        shell: bash
        run: |
          set -euo pipefail

          RAW_FILE="evals/cwe20/generated_0/core/py/cwe_020_0_raw.py"

          echo "Research input files:"
          find evals/cwe20 -type f -print

          if [ ! -f "$RAW_FILE" ]; then
            echo ""
            echo "ERROR: Missing original AI-generated sample:"
            echo "$RAW_FILE"
            exit 1
          fi

          echo ""
          echo "✓ Original CWE-20 sample found."


      # ============================================================
      # 4. CREATE A WRITABLE TEMPORARY EVALUATION DIRECTORY
      # ============================================================
      - name: Prepare writable evaluation workspace
        shell: bash
        run: |
          set -euo pipefail

          EVAL_WORK="$RUNNER_TEMP/cwe20_eval"

          echo "Preparing:"
          echo "$EVAL_WORK"

          rm -rf "$EVAL_WORK"
          mkdir -p "$EVAL_WORK"

          cp -a \
            "$GITHUB_WORKSPACE/evals/cwe20/." \
            "$EVAL_WORK/"

          chmod -R a+rwX "$EVAL_WORK"

          echo ""
          echo "Temporary evaluation contents:"
          find "$EVAL_WORK" -type f -print

          echo ""
          echo "Permissions:"
          ls -ld "$EVAL_WORK"
          ls -ld "$EVAL_WORK/generated_0"
          ls -ld "$EVAL_WORK/generated_0/core/py"


      # ============================================================
      # 5. PULL THE OFFICIAL CWEVAL DOCKER IMAGE
      # ============================================================
      - name: Pull official CWEval Docker image
        shell: bash
        run: |
          set -euo pipefail

          echo "Pulling co1lin/cweval..."

          docker pull co1lin/cweval

          echo ""
          echo "Docker image ID:"

          docker image inspect \
            co1lin/cweval \
            --format '{{.Id}}'

          docker image inspect \
            co1lin/cweval \
            > docker_image_inspect.json


      # ============================================================
      # 6. VERIFY CWEVAL PYTHON ENVIRONMENT
      # ============================================================
      - name: Verify CWEval Python environment
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            co1lin/cweval \
            zsh -lc '
              set -e

              export CWEVAL_ENV=/home/ubuntu/miniforge3/envs/cweval
              export PATH="$CWEVAL_ENV/bin:$PATH"

              echo "========================================"
              echo "CWEval environment"
              echo "========================================"

              echo ""
              echo "Python location:"
              command -v python

              echo ""
              echo "Python version:"
              python --version

              echo ""
              echo "Pytest location:"
              command -v pytest

              echo ""
              echo "Pytest version:"
              pytest --version

              echo ""
              echo "✓ CWEval Python environment available."
            '


      # ============================================================
      # 7. RUN PYTHON-ONLY CWEVAL EVALUATION
      #
      # IMPORTANT:
      #
      # We intentionally DO NOT call pipeline() here because
      # pipeline() invokes compile_parsed(), which performs
      # compiled-language environment checks.
      #
      # For Python:
      #
      #   parse_generated()
      #   run_tests()
      #   _merge_results()
      #   report_pass_at_k()
      #
      # ============================================================
      - name: Run Python-only CWEval sandbox evaluation
        shell: bash
        run: |
          set -euo pipefail

          EVAL_WORK="$RUNNER_TEMP/cwe20_eval"

          echo "Starting Python-only CWEval evaluation..."

          docker run --rm \
            -v "$RUNNER_TEMP/CWEval:/home/ubuntu/CWEval" \
            -v "$EVAL_WORK:/eval" \
            -w /home/ubuntu/CWEval \
            co1lin/cweval \
            zsh -lc '
              set -e

              export CWEVAL_ENV=/home/ubuntu/miniforge3/envs/cweval
              export PATH="$CWEVAL_ENV/bin:$PATH"
              export PYTHONPATH=/home/ubuntu/CWEval

              echo ""
              echo "========================================"
              echo "Execution environment"
              echo "========================================"

              echo ""
              echo "Python:"
              command -v python
              python --version

              echo ""
              echo "Evaluation directory:"
              find /eval -maxdepth 8 -type f -print

              echo ""
              echo "Write test:"
              touch /eval/write_test.tmp
              ls -l /eval/write_test.tmp
              rm /eval/write_test.tmp

              echo ""
              echo "✓ Evaluation directory writable."

              echo ""
              echo "========================================"
              echo "Running CWEval Python evaluation"
              echo "========================================"

              python -c "
from cweval.evaluate import Evaler

evaler = Evaler(
    eval_path=\"/eval\",
    num_proc=1
)

print(\"STEP 1: Parsing generated response...\")
evaler.parse_generated()

print(\"STEP 2: Running functional/security tests...\")
evaler.run_tests()

print(\"STEP 3: Merging results...\")
evaler._merge_results()

print(\"STEP 4: Reporting pass@k...\")
evaler.report_pass_at_k(mode=\"auto\")

print(\"PYTHON CWEVAL EVALUATION COMPLETE\")
"

              echo ""
              echo "✓ Python-only CWEval evaluation completed."
            '


      # ============================================================
      # 8. COPY RESULTS BACK INTO THE GITHUB WORKSPACE
      # ============================================================
      - name: Copy evaluation results back
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          EVAL_WORK="$RUNNER_TEMP/cwe20_eval"

          echo "Files created in temporary evaluation directory:"
          find "$EVAL_WORK" -maxdepth 10 -type f -print || true

          sudo chmod -R a+rwX "$EVAL_WORK" || true

          mkdir -p "$GITHUB_WORKSPACE/evals/cwe20"

          cp -a \
            "$EVAL_WORK/." \
            "$GITHUB_WORKSPACE/evals/cwe20/"

          echo ""
          echo "✓ Evaluation results copied back."


      # ============================================================
      # 9. DISPLAY THE CWEVAL RESULT
      # ============================================================
      - name: Display CWEval results
        if: always()
        shell: bash
        run: |
          echo "======================================================"
          echo "Generated evaluation files"
          echo "======================================================"

          find evals/cwe20 -maxdepth 10 -type f -print || true


          echo ""
          echo "======================================================"
          echo "res_all.json"
          echo "======================================================"

          if [ -f evals/cwe20/res_all.json ]; then
            cat evals/cwe20/res_all.json
          else
            echo "res_all.json not found."
          fi


          echo ""
          echo "======================================================"
          echo "generated_0/res.json"
          echo "======================================================"

          if [ -f evals/cwe20/generated_0/res.json ]; then
            cat evals/cwe20/generated_0/res.json
          else
            echo "generated_0/res.json not found."
          fi


      # ============================================================
      # 10. CREATE A SIMPLE FINAL CLASSIFICATION
      # ============================================================
      - name: Classify CWE-20 result
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "evals/cwe20/generated_0/res.json"
          )

          if not path.exists():
              print("res.json is not available.")
              raise SystemExit(0)

          data = json.loads(
              path.read_text()
          )

          print("=" * 60)
          print("CWE-20 AI GENERATION RESULT")
          print("=" * 60)

          if len(data) != 1:
              print(
                  "Unexpected number of result records:",
                  len(data)
              )

          for test_file, result in data.items():

              functional = bool(
                  result.get("functional")
              )

              secure = bool(
                  result.get("secure")
              )

              if functional and secure:
                  classification = "F+ S+"

              elif functional and not secure:
                  classification = "F+ S-"

              elif not functional and secure:
                  classification = "F- S+"

              else:
                  classification = "F- S-"

              print("Test file      :", test_file)
              print("Functional     :", functional)
              print("Secure         :", secure)
              print("Classification :", classification)

              record = {
                  "task_id": "cwe_020_0",
                  "cwe_id": "CWE-20",
                  "functional": functional,
                  "secure": secure,
                  "classification": classification,
                  "source_test": test_file,
              }

              Path(
                  "evals/cwe20/classification.json"
              ).write_text(
                  json.dumps(
                      record,
                      indent=2
                  )
              )

          PY


      # ============================================================
      # 11. DISPLAY CLASSIFICATION
      # ============================================================
      - name: Display final classification
        if: always()
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "FINAL CLASSIFICATION"
          echo "======================================================"

          if [ -f evals/cwe20/classification.json ]; then
            cat evals/cwe20/classification.json
          else
            echo "classification.json not produced."
          fi


      # ============================================================
      # 12. UPLOAD ALL RESULTS AS AN ARTIFACT
      # ============================================================
      - name: Upload CWEval evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cwe20-evaluation-results
          path: |
            evals/cwe20/
            docker_image_inspect.json
          if-no-files-found: warn
